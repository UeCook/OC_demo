<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 - 我的小站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #F8F8F8;
            --bg-secondary: #E8E8E8;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-primary: #1F1F1F;
            --text-sub: #646464;
            --accent: #4FC05D;
            --accent-rgb: 79, 192, 93;
            --border-color: rgba(79, 192, 93, 0.3);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: rgba(26, 26, 26, 0.8);
            --text-primary: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'OPPO Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-content-wrapper {
            width: 100%;
            max-width: 1400px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 3fr 0.3fr;
            gap: 20px;
            height: auto;
            min-height: 600px;
        }

        .bento-item {
            position: relative;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .bento-item {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .bento-item:hover {
            box-shadow: 0 20px 40px rgba(var(--accent-rgb), 0.2);
            border-color: rgba(var(--accent-rgb), 0.5);
        }

        [data-theme="dark"] .bento-item:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* 聚光灯效果 */
        .spotlight-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: 24px;
            z-index: 1;
        }

        .spotlight {
            position: absolute;
            width: 2000px;
            height: 2000px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(
                circle at center,
                rgba(var(--accent-rgb), 0.15) 0%,
                rgba(var(--accent-rgb), 0.12) 20%,
                rgba(var(--accent-rgb), 0.08) 40%,
                rgba(var(--accent-rgb), 0.04) 60%,
                rgba(var(--accent-rgb), 0.01) 80%,
                transparent 100%
            );
            filter: blur(30px);
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .bento-item:hover .spotlight {
            opacity: 1;
        }

        .bento-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .col-span-2 {
            grid-column: span 2;
        }

        .row-span-3 {
            grid-row: span 1;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            margin-top: 10px;
            pointer-events: none;
            position: relative;
            z-index: 2;
        }

        p {
            color: var(--text-sub);
            line-height: 1.6;
            pointer-events: none;
            position: relative;
            z-index: 2;
        }

        .tags-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            position: relative;
            z-index: 2;
        }

        .tag {
            background: rgba(var(--accent-rgb), 0.2);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(var(--accent-rgb), 0.3);
        }

        .bento-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .bento-icon {
            width: 40px;
            height: 40px;
            background: rgba(var(--accent-rgb), 0.2);
            color: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bento-icon svg {
            width: 16px;
            height: 16px;
        }

        .bento-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .link-item {
            color: var(--text-primary);
            text-decoration: none;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 12px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        [data-theme="dark"] .link-item {
            background: rgba(255, 255, 255, 0.05);
        }

        .link-item:hover {
            background: rgba(var(--accent-rgb), 0.1);
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .content-toggle {
            margin-bottom: 20px;
        }

        .avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .profile-info {
            text-align: center;
            width: 100%;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
            pointer-events: none;
        }

        .profile-title {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 16px;
            font-weight: 500;
            pointer-events: none;
        }

        .profile-bio {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.8;
            pointer-events: none;
            text-align: left;
        }

        .icons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .icon-item {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--accent-rgb), 0.08);
            border-radius: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        [data-theme="dark"] .icon-item {
            background: rgba(var(--accent-rgb), 0.1);
        }

        .icon-item:hover {
            background: rgba(var(--accent-rgb), 0.2);
            border-color: var(--accent);
        }

        .icon-img {
            width: 40px;
            height: 40px;
            fill: var(--text-primary);
            transition: fill 0.3s ease;
        }

        .icon-item:hover .icon-img {
            fill: var(--accent);
        }

        /* ==================== 
           按钮样式
           ==================== */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .btn-primary:hover {
            background: #45a852;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            color: var(--text-sub);
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            white-space: nowrap;
            outline: none;
        }
        
        .btn-secondary:hover {
            color: var(--text-primary);
            background: var(--bg-card);
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.2);
            transform: translateY(-2px);
        }
        
        .btn-secondary:active {
            transform: translateY(0);
        }

        @media (max-width: 1024px) {
            .bento-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .col-span-2 {
                grid-column: span 1;
            }
            
            h2 {
                font-size: 1.5rem;
            }
        }

        /* 主题切换按钮 */
        .theme-toggle-corner {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
        }

        .theme-toggle {
            position: relative;
            z-index: 3000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: var(--text-primary);
            cursor: pointer;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.3s ease;
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        [data-theme="dark"] #sunIcon { display: none; }
        [data-theme="dark"] #moonIcon { display: block; }
        [data-theme="light"] #sunIcon { display: block; }
        [data-theme="light"] #moonIcon { display: none; }

        /* ==================== 
           跳转确认弹窗样式
           ==================== */
        .jump-confirm-overlay {
            display: none;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(70px);
            -webkit-backdrop-filter: blur(70px);
        }
        
        .jump-confirm-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .jump-confirm-content {
            position: relative;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 420px;
            padding: 0;
            z-index: 2001;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .jump-confirm-overlay.active .jump-confirm-content {
            opacity: 1;
            transform: scale(1);
        }
        
        .jump-confirm-header {
            display: flex;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .jump-confirm-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            flex-shrink: 0;
        }
        
        .jump-confirm-icon svg {
            width: 22px;
            height: 22px;
            fill: white;
        }
        
        .jump-confirm-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .jump-confirm-body {
            padding: 24px;
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .jump-confirm-url-text {
            word-break: break-all;
            background: rgba(var(--accent-rgb), 0.1);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 12px;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
        }
        
        .jump-confirm-footer {
            padding: 20px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
        }

        /* ==================== 
           普通弹窗样式
           ==================== */
        .modal-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(70px);
            -webkit-backdrop-filter: blur(70px);
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            position: relative;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow: hidden;
            padding: 0;
            z-index: 1001;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
        }
        
        .modal-overlay.active .modal-content {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: inherit;
            backdrop-filter: inherit;
            z-index: 10;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-sub);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
        }
        
        .modal-body {
            padding: 24px;
            color: var(--text-primary);
            line-height: 1.6;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(var(--accent-rgb), 0.3) transparent;
        }
        
        .modal-body::-webkit-scrollbar {
            width: 6px;
            display: block;
        }
        
        .modal-body::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 3px;
        }
        
        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(var(--accent-rgb), 0.3);
            border-radius: 3px;
        }
        
        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            background: inherit;
            backdrop-filter: inherit;
            position: sticky;
            bottom: 0;
            z-index: 5;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            align-items: center;
        }

        /* ==================== 
           微信二维码弹窗样式
           ==================== */
        .wechat-modal {
            max-width: 500px;
        }
        
        .wechat-modal-img-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .wechat-modal-img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 10px;
        }
        
        .wechat-qr-mask {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            border-radius: 10px;
        }
        
        .wechat-qr-mask:hover {
            background: rgba(26, 26, 26, 0.95);
        }
        
        .wechat-qr-mask.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .wechat-qr-mask-text {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            opacity: 1;
            padding: 0 20px;
        }
        
        .wechat-modal-content {
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- 主题切换按钮 -->
    <div class="theme-toggle-corner">
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
            <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <div class="page-content-wrapper">
        <div class="bento-grid">
            <!-- 左侧个人信息卡片 -->
            <div class="bento-item" style="border-radius: 24px; display: flex; flex-direction: column; align-items: center;">
                <div class="spotlight-container">
                    <div class="spotlight"></div>
                </div>
                <div class="bento-content" style="display: flex; flex-direction: column; align-items: center;">
                    <!-- 头像框 -->
                    <div class="avatar-container">
                        <img src="img/avatar.png" alt="头像" class="avatar-img" onerror="this.src='img/avatar.jpg'">
                    </div>
                    
                    <!-- 个人信息 -->
                    <div class="profile-info">
                        <h2 class="profile-name">你的名字</h2>
                        <p class="profile-title">一句个性签名~</p>
                        <p class="profile-bio" style="text-align: left;">
名字：（昵称）<br>
原型：（设定原型）<br>
性别：（性别）<br>
核心：（核心特征）<br>
能力：（能力描述）<br>
性格：（性格描述）<br>
                        </p>
                    </div>

                    <!-- 技术标签 -->
                    <div class="tags-container" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: auto; align-items: center;">
                        <span class="tag">标签一</span>
                        <span class="tag">标签二</span>
                    </div>
                </div>
            </div>

            <!-- 中间关于卡片 -->
            <div class="bento-item" style="border-radius: 24px;">
                <div class="spotlight-container">
                    <div class="spotlight"></div>
                </div>
                <div class="bento-content">
                    <!-- 标题 -->
                    <h2 style="font-size: 2.5rem; margin-bottom: 1.5rem; margin-top: 10px; pointer-events: none;">关于我</h2>
                    
                    <!-- 文本内容 -->
                    <div id="about-text-content">
                        <p style="color: var(--text-sub); font-size: 1.15rem; line-height: 2.2; pointer-events: none;">
在此书写内容<br>
                        </p>
                    </div>
                </div>
            </div>

            <!-- 右侧图标卡片 -->
            <div class="bento-item" style="border-radius: 24px; padding: 20px;">
                <div class="spotlight-container">
                    <div class="spotlight"></div>
                </div>
                <div class="bento-content" style="padding: 20px;">
                    <div class="icons-container">
                        <div class="icon-item">
                            <img src="img/email.svg" alt="邮箱" class="icon-img">
                        </div>
                        <div class="icon-item">
                            <img src="img/github.svg" alt="GitHub" class="icon-img">
                        </div>
                        <div class="icon-item">
                            <img src="img/xhs.svg" alt="小红书" class="icon-img">
                        </div>
                        <div class="icon-item">
                            <img src="img/blbl.svg" alt="B站" class="icon-img">
                        </div>
                        <div class="icon-item">
                            <img src="img/qq.svg" alt="QQ" class="icon-img">
                        </div>
                        <div class="icon-item">
                            <img src="img/wechat.svg" alt="微信" class="icon-img">
                        </div>
                        <div class="icon-item">
                            <img src="img/zhihu.svg" alt="知乎" class="icon-img">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 跳转确认弹窗 -->
    <div class="jump-confirm-overlay" id="jumpConfirmModal">
        <div class="jump-confirm-content">
            <div class="jump-confirm-header">
                <div class="jump-confirm-title">即将跳转到外部链接...</div>
            </div>
            <div class="jump-confirm-body">
                <p>请注意隐私安全，第三方页面不受本网站控制，确认要继续吗？</p>
                <div class="jump-confirm-url-text" id="jumpConfirmUrl"></div>
            </div>
            <div class="jump-confirm-footer">
                <button class="btn-secondary" onclick="closeJumpConfirm()">取消</button>
                <button class="btn-primary" onclick="performJump()">继续跳转</button>
            </div>
        </div>
    </div>

    <!-- 微信二维码弹窗 -->
    <div class="modal-overlay" id="wechatModal">
        <div class="modal-content wechat-modal-content">
            <div class="modal-header">
                <h2 class="modal-title">微信二维码</h2>
                <button class="modal-close" onclick="closeModal('wechatModal')">&times;</button>
            </div>
            <div class="modal-body wechat-modal-body">
                <p>扫描二维码添加微信好友</p>  
                <div class="wechat-modal-img-container">
                    <img src="img/wechat_add.jpg" alt="微信二维码" class="wechat-modal-img" onerror="this.src='https://via.placeholder.com/300x300?text=QR'">
                    <div class="wechat-qr-mask" id="wechatQRMask" onclick="revealQR()">
                        <div class="wechat-qr-mask-text">点击显示二维码</div>
                    </div>
                </div>
                <p>请使用微信扫一扫功能扫描上方二维码</p>
            </div>
            <div class="modal-footer">
                <div class="modal-actions">
                    <button class="btn-primary" onclick="closeModal('wechatModal')">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 图标链接配置，微信二维码文件路径："/img/wechat_add.jpg"
        const iconLinks = {
            'blbl': 'https://space.bilibili.com/你的B站UID',
            'email': 'mailto:your-email@example.com',
            'github': 'https://github.com/你的GitHub用户名',
            'qq': 'https://qm.qq.com/q/你的QQ二维码链接',
            'wechat': 'wechat',
            'xhs': 'https://xhslink.com/你的小红书链接',
            'zhihu': 'https://www.zhihu.com/people/你的知乎ID'
        };

        let jumpTargetUrl = '';

        // 打开跳转确认弹窗
        function openJumpConfirm(url) {
            jumpTargetUrl = url;
            document.getElementById('jumpConfirmUrl').textContent = url;
            document.body.style.overflow = 'hidden';
            const modal = document.getElementById('jumpConfirmModal');
            modal.style.display = 'flex';
            void modal.offsetWidth;
            setTimeout(() => {
                modal.classList.add('active');
            }, 10);
        }

        // 关闭跳转确认弹窗
        function closeJumpConfirm() {
            const modal = document.getElementById('jumpConfirmModal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
                document.body.style.overflow = '';
                jumpTargetUrl = '';
            }, 300);
        }

        // 执行跳转
        function performJump() {
            if (jumpTargetUrl) {
                window.open(jumpTargetUrl, '_blank', 'noopener,noreferrer');
            }
            closeJumpConfirm();
        }

        // 打开微信二维码弹窗
        function showWechatQR() {
            // 重置遮罩状态
            document.getElementById('wechatQRMask').classList.remove('hidden');
            openModal('wechatModal');
        }
        
        // 显示二维码（移除遮罩）
        function revealQR() {
            const mask = document.getElementById('wechatQRMask');
            mask.classList.add('hidden');
        }

        // 打开普通弹窗
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            document.body.style.overflow = 'hidden';
            modal.style.display = 'flex';
            void modal.offsetWidth;
            setTimeout(() => {
                modal.classList.add('active');
            }, 10);
        }

        // 关闭普通弹窗
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('active');
            
            // 如果是微信弹窗，重置遮罩状态
            if (modalId === 'wechatModal') {
                setTimeout(() => {
                    document.getElementById('wechatQRMask').classList.remove('hidden');
                }, 300);
            }
            
            setTimeout(() => {
                modal.style.display = 'none';
                document.body.style.overflow = '';
            }, 400);
        }

        // 为图标添加点击事件
        document.querySelectorAll('.icon-item').forEach(item => {
            item.addEventListener('click', function() {
                const img = this.querySelector('img');
                const alt = img.alt;
                const iconType = Object.keys(iconLinks).find(key => iconLinks[key] === alt || img.src.includes(key));
                
                if (iconType) {
                    const link = iconLinks[iconType];
                    if (link === 'wechat') {
                        // 微信特殊处理：显示二维码弹窗
                        showWechatQR();
                    } else if (iconType === 'email') {
                        // 邮件直接打开
                        window.location.href = link;
                    } else {
                        // 其他链接：显示跳转确认弹窗
                        openJumpConfirm(link);
                    }
                }
            });
        });

        // 键盘事件处理：ESC键关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeJumpConfirm();
                closeModal('wechatModal');
            }
        });

        // 初始化聚光灯效果
        function initSpotlight() {
            const bentoItems = document.querySelectorAll('.bento-item');
            
            bentoItems.forEach(item => {
                const spotlight = item.querySelector('.spotlight');
                
                if (!spotlight) return;
                
                // 鼠标移动事件
                item.addEventListener('mousemove', (e) => {
                    const rect = item.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    // 更新聚光灯位置
                    spotlight.style.left = `${x}px`;
                    spotlight.style.top = `${y}px`;
                });
                
                // 鼠标离开时重置
                item.addEventListener('mouseleave', () => {
                    // 聚光灯会在CSS中通过opacity过渡自动隐藏
                });
            });
        }

        // 主题切换
        function initThemeToggle() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            
            if (!themeToggle) return;
            
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                html.setAttribute('data-theme', savedTheme);
            }
            
            themeToggle.addEventListener('click', () => {
                const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        }

        // DOM加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initSpotlight();
            initThemeToggle();
        });
    </script>

</body>
</html>
