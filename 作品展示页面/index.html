<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品 - 圣堂之魂</title>
    <style>
        /* ==================== 
           CSS变量与主题系统
           ==================== */
        :root {
            /* 亮色主题变量 */
            --bg-color: #F8F8F8;
            --text-main: #1F1F1F;
            --text-body: #3D3D3D;
            --text-sub: #646464;
            --accent-color: 79, 192, 93;
            --accent-color-rgb: 79, 192, 93;
            --complementary-color: 232, 179, 162;
            
            /* 卡片背景 */
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(var(--accent-color), 0.3);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            
            /* 导航背景 */
            --nav-bg: rgba(248, 248, 248, 0.95);
            
            /* 圆角统一 */
            --border-radius-lg: 24px;
            --border-radius-md: 20px;
            --border-radius-sm: 16px;
            
            /* 按钮颜色 */
            --btn-bg: #1a1a1a;
            --btn-text: #ffffff;
            --btn-hover-bg: #333333;
        }

        /* 暗色主题变量 */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #F0F0F0;
            --text-body: #D4D4D4;
            --text-sub: #A0A0A0;
            --complementary-color: 192, 122, 122;
            
            --card-bg: rgba(30, 30, 30, 0.8);
            --card-border: rgba(var(--accent-color), 0.3);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            
            --nav-bg: rgba(18, 18, 18, 0.95);
            
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover-bg: #e5e5e5;
        }

        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-y: auto;
        }

        /* 页面容器 */
        .page {
            min-height: 100vh;
            padding: 80px 24px 120px;
        }

        /* 作品页样式 */
        .portfolio-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .portfolio-container h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .portfolio-container > p {
            color: var(--text-sub);
            font-size: 1.1rem;
            max-width: 600px;
        }

        .portfolio-grid {
            column-count: auto;
            column-width: 280px;
            column-gap: 20px;
            margin-top: 32px;
        }

        .portfolio-item {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            width: 100%;
            display: inline-block;
            flex-direction: column;
            box-shadow: var(--card-shadow);
            break-inside: avoid;
            margin-bottom: 20px;
        }

        .portfolio-image-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: rgba(var(--accent-color), 0.05);
            flex-shrink: 0;
        }

        .portfolio-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            display: block;
        }

        .portfolio-image.error {
            min-height: 200px;
            background: rgba(var(--accent-color), 0.05);
        }

        .portfolio-info {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .portfolio-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        .portfolio-summary {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .portfolio-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .portfolio-date {
            color: var(--text-body);
            font-weight: 500;
        }

        .portfolio-category {
            padding: 2px 8px;
            background: rgba(var(--accent-color), 0.08);
            color: var(--text-sub);
            border-radius: 4px;
            font-weight: 500;
        }

        /* 空状态 */
        .portfolio-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-sub);
        }

        .portfolio-empty p {
            font-size: 1.1rem;
        }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(16px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-color);
            border: 2px solid rgba(var(--accent-color), 0.3);
            border-radius: 24px;
            max-width: 1200px;
            width: 92%;
            height: 85vh;
            max-height: 800px;
            overflow: hidden;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
            position: relative;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 0;
        }

        .modal-close svg {
            width: 20px;
            height: 20px;
        }

        .modal-body {
            display: flex;
            height: 100%;
            flex-direction: row;
            gap: 0;
        }

        .modal-image-section {
            flex: 1.2;
            min-width: 320px;
            max-width: 65%;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 32px;
        }

        .modal-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        .modal-info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            border-left: 1px solid rgba(var(--accent-color), 0.15);
            min-width: 360px;
            max-width: 500px;
            position: relative;
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.08);
        }

        .modal-content-scroll {
            flex: 1;
            padding: 32px;
            overflow-y: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .modal-content-scroll::-webkit-scrollbar {
            display: none;
            width: 0;
        }

        .modal-scrollbar {
            position: absolute;
            right: 0;
            top: 0;
            width: 8px;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .modal-scrollbar-thumb {
            position: absolute;
            top: 0;
            right: 2px;
            width: 4px;
            min-height: 30px;
            background: rgba(128, 128, 128, 0.3);
            border-radius: 2px;
            pointer-events: auto;
            cursor: pointer;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 24px;
            line-height: 1.3;
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px 24px;
            margin-bottom: 28px;
            padding: 20px 24px;
            background: rgba(var(--accent-color), 0.05);
            border-radius: 16px;
            border: 1px solid rgba(var(--accent-color), 0.15);
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .info-value {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .modal-description {
            font-size: 0.95rem;
            color: var(--text-body);
            line-height: 1.8;
            margin-bottom: 28px;
            white-space: pre-wrap;
        }

        .modal-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            margin-top: 24px;
        }

        .modal-section-title:first-child {
            margin-top: 0;
        }

        .modal-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal-tag {
            padding: 6px 14px;
            background: rgba(var(--accent-color), 0.1);
            color: rgba(var(--accent-color), 1);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* 主题切换按钮 */
        .theme-toggle-corner {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2000;
        }

        .theme-toggle {
            position: relative;
            z-index: 3000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: var(--text-main);
            cursor: pointer;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin-left: 4px;
            margin-top: 2px;
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        [data-theme="dark"] #sunIcon { display: none; }
        [data-theme="dark"] #moonIcon { display: block; }
        [data-theme="light"] #sunIcon { display: block; }
        [data-theme="light"] #moonIcon { display: none; }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .page {
                padding: 100px 16px 140px;
            }
            
            .portfolio-grid {
                column-count: 1;
            }
            
            .modal-overlay {
                padding: 0;
            }
            
            .modal-content {
                width: 100%;
                height: 100%;
                max-height: 100vh;
                border-radius: 0;
            }
            
            .modal-body {
                flex-direction: column;
            }
            
            .modal-image-section {
                flex: none;
                height: 40vh;
                min-height: 240px;
                max-width: 100%;
                padding: 20px;
            }
            
            .modal-image {
                max-height: 100%;
                object-fit: contain;
            }
            
            .modal-info-section {
                border-left: none;
                border-top: 2px solid rgba(var(--accent-color), 0.3);
            }
            
            .modal-content-scroll {
                padding: 24px 20px;
            }
            
            .modal-title {
                font-size: 1.25rem;
            }
            
            .modal-close {
                top: 12px;
                right: 12px;
                background: rgba(0, 0, 0, 0.6);
            }
        }
    </style>
</head>
<body>
    <div class="page">
            <div class="portfolio-container">
            <h1>我的作品</h1>
            <p>这里展示了我的一些创作作品和设计项目</p>
            
            <div class="portfolio-grid" id="portfolioGrid">
                <!-- 作品卡片将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 左下角主题切换按钮 -->
    <div class="theme-toggle-corner">
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
            <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <!-- 引入作品数据文件 -->
    <script src="portfolio-data.js"></script>
    
    <!-- 作品详情弹窗 -->
    <div class="modal-overlay" id="portfolioModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-body">
                <div class="modal-image-section">
                    <img src="" alt="" class="modal-image" id="modalImage">
                </div>
                <div class="modal-info-section">
                    <div class="modal-content-scroll" id="modalContentScroll">
                        <h3 class="modal-title" id="modalTitle"></h3>
                        <div class="modal-metadata" id="modalMeta"></div>
                        <p class="modal-description" id="modalDescription"></p>
                        <div class="modal-tags" id="modalTags"></div>
                    </div>
                    <div class="modal-scrollbar" id="modalScrollbar">
                        <div class="modal-scrollbar-thumb" id="modalScrollbarThumb"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 
        // 图片加载辅助函数
        // ==================== 
        function loadImageWithFallback(imageElement, src, alt) {
            const extensions = ['.jpg', '.jpeg', '.png', '.webp', '.svg', '.gif'];
            const baseName = src.replace(/\.[^/.]+$/, "");
            const currentExt = src.substring(src.lastIndexOf('.')).toLowerCase();
            const currentIndex = extensions.indexOf(currentExt);
            
            let formatIndex = 0;
            let placeholderAdded = false;
            let placeholderElement = null;
            
            function tryNextFormat() {
                if (formatIndex >= extensions.length) {
                    // 所有格式都失败，显示占位符
                    if (!placeholderAdded) {
                        placeholderAdded = true;
                        imageElement.classList.add('error');
                        imageElement.style.display = 'none';
                        
                        // 检查是否已经存在占位符，避免重复添加
                        const existingPlaceholder = imageElement.parentNode.querySelector('.image-placeholder');
                        if (existingPlaceholder) {
                            placeholderElement = existingPlaceholder;
                        } else {
                            placeholderElement = document.createElement('div');
                            placeholderElement.className = 'image-placeholder';
                            placeholderElement.style.cssText = 'width:100%;height:200px;display:flex;align-items:center;justify-content:center;background:rgba(var(--accent-color),0.05);color:var(--text-sub);font-size:0.9rem;';
                            placeholderElement.textContent = '图片加载失败';
                            imageElement.parentNode.appendChild(placeholderElement);
                        }
                    }
                    return;
                }
                
                // 跳过当前格式
                if (formatIndex === currentIndex) {
                    formatIndex++;
                    tryNextFormat();
                    return;
                }
                
                const newSrc = baseName + extensions[formatIndex];
                const testImg = new Image();
                
                testImg.onload = function() {
                    // 格式可用，加载图片
                    imageElement.src = newSrc;
                    // 图片加载成功，移除占位符（如果有）
                    if (placeholderElement) {
                        placeholderElement.remove();
                        placeholderElement = null;
                    }
                    // 移除错误样式
                    imageElement.classList.remove('error');
                    imageElement.style.display = '';
                };
                
                testImg.onerror = function() {
                    // 当前格式失败，尝试下一个
                    formatIndex++;
                    tryNextFormat();
                };
                
                testImg.src = newSrc;
            }
            
            // 清理已有的占位符
            const existingPlaceholder = imageElement.parentNode.querySelector('.image-placeholder');
            if (existingPlaceholder) {
                existingPlaceholder.remove();
            }
            
            // 设置错误处理
            imageElement.onerror = function() {
                // 移除当前错误处理器，避免无限循环
                imageElement.onerror = null;
                tryNextFormat();
            };
        }

        // ==================== 
        // 创建作品卡片
        // ==================== 
        function createPortfolioCard(item) {
            const card = document.createElement('div');
            card.className = 'portfolio-item';
            card.dataset.id = item.id;
            card.dataset.category = item.category;
            
            const imgSrc = item.image;
            
            card.innerHTML = `
                <div class="portfolio-image-wrapper">
                    <img src="${imgSrc}" alt="${item.title}" class="portfolio-image" loading="lazy">
                </div>
                <div class="portfolio-info">
                    <h3 class="portfolio-title">${item.title}</h3>
                    <p class="portfolio-summary">${item.summary}</p>
                    <div class="portfolio-meta">
                        <span class="portfolio-date">${item.date}</span>
                        <span class="portfolio-category">${PortfolioManager.getCategoryName(item.category)}</span>
                    </div>
                </div>
            `;
            
            const img = card.querySelector('.portfolio-image');
            loadImageWithFallback(img, imgSrc, item.title);
            
            card.onclick = () => openModal(item);
            
            return card;
        }

        // ==================== 
        // 渲染作品（瀑布流布局）
        // ==================== 
        function renderPortfolio(items, append = false) {
            const grid = document.getElementById('portfolioGrid');
            if (!grid) return;
            
            if (!append) {
                grid.innerHTML = '';
            }
            
            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="portfolio-empty">
                        <p>暂无作品</p>
                    </div>
                `;
                return;
            }
            
            // 直接将卡片添加到网格中，CSS columns会自动处理布局
            items.forEach(item => {
                const card = createPortfolioCard(item);
                grid.appendChild(card);
            });
        }

        // ==================== 
        // 初始化作品页面
        // ==================== 
        function initPortfolio(filter = null) {
            let items;
            
            if (filter) {
                if (filter.category) {
                    items = PortfolioManager.getByCategory(filter.category);
                } else if (filter.tag) {
                    items = PortfolioManager.getByTag(filter.tag);
                } else if (filter.featured) {
                    items = PortfolioManager.getFeatured();
                } else {
                    // 默认使用随机排序（置顶在前）
                    items = PortfolioManager.getRandomizedWithPinned();
                }
            } else {
                // 默认使用随机排序（置顶在前）
                items = PortfolioManager.getRandomizedWithPinned();
            }
            
            renderPortfolio(items);
        }

        // ==================== 
        // 弹窗功能
        // ==================== 
        let modalScrollHandler = null;
        let modalDragMoveHandler = null;
        let modalDragUpHandler = null;
        let modalResizeHandler = null;

        function openModal(item) {
            const modal = document.getElementById('portfolioModal');
            const image = document.getElementById('modalImage');
            const title = document.getElementById('modalTitle');
            const description = document.getElementById('modalDescription');
            const tags = document.getElementById('modalTags');
            
            title.textContent = item.title;
            description.textContent = item.description;
            
            tags.innerHTML = '';
            item.tags.forEach(tag => {
                const tagElement = document.createElement('span');
                tagElement.className = 'modal-tag';
                tagElement.textContent = tag;
                tags.appendChild(tagElement);
            });
            
            const metaContainer = document.getElementById('modalMeta');
            if (metaContainer && item) {
                metaContainer.innerHTML = renderInfoGrid(item);
            }
            
            image.alt = item.title;
            image.src = item.image;
            loadImageWithFallback(image, item.image, item.title);
            
            document.body.style.overflow = 'hidden';
            
            initModalScrollbar();
            
            modal.classList.add('active');
        }

        function initModalScrollbar() {
            const scrollArea = document.getElementById('modalContentScroll');
            const thumb = document.getElementById('modalScrollbarThumb');
            
            if (!scrollArea || !thumb) return;
            
            cleanupModalScrollbar();
            
            function updateThumb() {
                const scrollHeight = scrollArea.scrollHeight;
                const clientHeight = scrollArea.clientHeight;
                const scrollTop = scrollArea.scrollTop;
                
                if (scrollHeight <= clientHeight) {
                    thumb.style.display = 'none';
                    return;
                }
                
                thumb.style.display = 'block';
                
                const thumbHeight = Math.max((clientHeight / scrollHeight) * clientHeight, 30);
                const maxScroll = scrollHeight - clientHeight;
                const scrollPercent = maxScroll > 0 ? scrollTop / maxScroll : 0;
                const maxThumbOffset = clientHeight - thumbHeight;
                const thumbTop = scrollPercent * maxThumbOffset;
                
                thumb.style.height = thumbHeight + 'px';
                thumb.style.transform = `translateY(${thumbTop}px)`;
            }
            
            modalScrollHandler = updateThumb;
            scrollArea.addEventListener('scroll', updateThumb, { passive: true });
            
            // 添加窗口大小改变事件监听，确保滚动条状态正确
            let resizeTimeout = null;
            const resizeHandler = () => {
                // 使用防抖优化性能
                if (resizeTimeout) {
                    clearTimeout(resizeTimeout);
                }
                resizeTimeout = setTimeout(() => {
                    requestAnimationFrame(updateThumb);
                }, 100);
            };
            window.addEventListener('resize', resizeHandler, { passive: true });
            
            // 将 resizeHandler 保存到全局，以便 cleanup 时移除
            modalResizeHandler = resizeHandler;
            
            // 延迟初始化，确保 DOM 布局完成
            setTimeout(updateThumb, 0);
            
            let isDragging = false;
            let dragStartY = 0;
            let dragStartScroll = 0;
            
            thumb.onmousedown = (e) => {
                isDragging = true;
                dragStartY = e.clientY;
                dragStartScroll = scrollArea.scrollTop;
                document.body.style.userSelect = 'none';
                e.preventDefault();
            };
            
            modalDragMoveHandler = (e) => {
                if (!isDragging) return;
                
                const deltaY = e.clientY - dragStartY;
                const scrollHeight = scrollArea.scrollHeight;
                const clientHeight = scrollArea.clientHeight;
                const thumbHeight = Math.max((clientHeight / scrollHeight) * clientHeight, 30);
                const maxThumbOffset = clientHeight - thumbHeight;
                const maxScroll = scrollHeight - clientHeight;
                
                const scrollDelta = (deltaY / maxThumbOffset) * maxScroll;
                scrollArea.scrollTop = dragStartScroll + scrollDelta;
            };
            
            modalDragUpHandler = () => {
                isDragging = false;
                document.body.style.userSelect = '';
            };
            
            document.addEventListener('mousemove', modalDragMoveHandler);
            document.addEventListener('mouseup', modalDragUpHandler);
        }

        function cleanupModalScrollbar() {
            const scrollArea = document.getElementById('modalContentScroll');
            
            if (scrollArea && modalScrollHandler) {
                scrollArea.removeEventListener('scroll', modalScrollHandler);
            }
            if (modalDragMoveHandler) {
                document.removeEventListener('mousemove', modalDragMoveHandler);
            }
            if (modalDragUpHandler) {
                document.removeEventListener('mouseup', modalDragUpHandler);
            }
            if (modalResizeHandler) {
                window.removeEventListener('resize', modalResizeHandler);
            }
            
            modalScrollHandler = null;
            modalDragMoveHandler = null;
            modalDragUpHandler = null;
            modalResizeHandler = null;
        }

        function renderInfoGrid(item) {
            // 格式化日期
            let displayDate = item.date;
            if (item.date && item.date.length === 7) {
                // 处理 YYYY-MM 格式
                displayDate = `${item.date}-01`;
            }
            const dateObj = new Date(displayDate);
            const formattedDate = dateObj.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
            
            return `
                <div class="modal-info-grid">
                    <div>
                        <div class="info-label">创作日期</div>
                        <div class="info-value">${formattedDate}</div>
                    </div>
                    <div>
                        <div class="info-label">画师</div>
                        <div class="info-value">${item.artist || '未知'}</div>
                    </div>
                    <div>
                        <div class="info-label">稿件状态</div>
                        <div class="info-value">${item.status || '常稿'}</div>
                    </div>
                    <div>
                        <div class="info-label">约稿平台</div>
                        <div class="info-value">${item.metadata?.platform || '个人创作'}</div>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            const modal = document.getElementById('portfolioModal');
            modal.classList.remove('active');
            
            cleanupModalScrollbar();
            
            setTimeout(() => {
                document.body.style.overflow = '';
                document.getElementById('modalImage').src = '';
            }, 400);
        }

        // ==================== 
        // 主题切换
        // ==================== 
        function initThemeToggle() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            
            if (!themeToggle) return;
            
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                html.setAttribute('data-theme', savedTheme);
            }
            
            themeToggle.addEventListener('click', () => {
                const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        }

        // ==================== 
        // 键盘事件
        // ==================== 
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ==================== 
        // 初始化
        // ==================== 
        document.addEventListener('DOMContentLoaded', () => {
            initPortfolio();
            initThemeToggle();
        });
    </script>
</body>
</html>
