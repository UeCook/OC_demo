<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说阅读 - 圣堂之魂</title>
    <style>
        /* ==================== 
           CSS变量与主题系统
           ==================== */
        :root {
            /* 亮色主题变量 */
            --bg-color: #F8F8F8;
            --text-main: #1F1F1F;
            --text-body: #3D3D3D;
            --text-sub: #646464;
            --accent-color: 79, 192, 93;
            --accent-color-rgb: 79, 192, 93;
            --complementary-color: 232, 179, 162;
            
            /* 卡片背景 */
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(var(--accent-color), 0.3);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            
            /* 导航背景 */
            --nav-bg: rgba(248, 248, 248, 0.95);
            
            /* 圆角统一 */
            --border-radius-lg: 24px;
            --border-radius-md: 20px;
            --border-radius-sm: 16px;
            
            /* 按钮颜色 */
            --btn-bg: #1a1a1a;
            --btn-text: #ffffff;
            --btn-hover-bg: #333333;
        }

        /* 暗色主题变量 */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #F0F0F0;
            --text-body: #D4D4D4;
            --text-sub: #A0A0A0;
            --complementary-color: 192, 122, 122;
            
            --card-bg: rgba(30, 30, 30, 0.8);
            --card-border: rgba(var(--accent-color), 0.3);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            
            --nav-bg: rgba(18, 18, 18, 0.95);
            
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover-bg: #e5e5e5;
        }

        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 隐藏阅读器内容区域的滚动条 */
        .reader-content::-webkit-scrollbar {
            display: none;
            width: 0;
        }
        
        .reader-content {
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 40px 20px !important;
        }
        
        /* 隐藏章节列表的滚动条 */
        .reader-chapter-list::-webkit-scrollbar {
            display: none;
            width: 0;
        }
        
        .reader-chapter-list {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        /* 隐藏设置面板的滚动条 */
        .reader-settings-content::-webkit-scrollbar {
            display: none;
            width: 0;
        }
        
        .reader-settings-content {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        /* 主题按钮样式 */
        .reader-theme-btn {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-sub);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .reader-theme-btn:hover {
            border-color: rgba(var(--accent-color), 0.3);
        }
        
        .reader-theme-btn.active {
            background: rgba(var(--accent-color), 0.15);
            border-color: rgb(var(--accent-color));
            color: rgb(var(--accent-color));
        }
        
        /* 设置面板和侧边栏不透明背景 */
        .reader-sidebar,
        .reader-settings-panel {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        
        [data-theme="light"] .reader-sidebar,
        [data-theme="light"] .reader-settings-panel {
            background: rgb(255, 255, 255);
        }
        
        [data-theme="dark"] .reader-sidebar,
        [data-theme="dark"] .reader-settings-panel {
            background: rgb(20, 20, 20);
        }

        /* ==================== 
           小说阅读器样式
           ==================== */

        /* 阅读页面 */
        #reader-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            background: var(--bg-color);
            opacity: 1;
            visibility: visible;
        }

        /* 阅读器容器 */
        .reader-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        /* 阅读器头部 */
        .reader-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 32px;
            height: 80px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            flex-shrink: 0;
            z-index: 10;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
        }

        .reader-back-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: transparent;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reader-back-btn:hover {
            background: rgba(var(--accent-color-rgb), 0.1);
            border-color: rgba(var(--accent-color-rgb), 0.3);
        }

        .reader-back-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .reader-novel-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
            flex: 1;
            text-align: center;
            padding: 0 30px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reader-actions {
            display: flex;
            gap: 8px;
        }

        .reader-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: transparent;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reader-btn:hover {
            background: rgba(var(--accent-color-rgb), 0.1);
            border-color: rgba(var(--accent-color-rgb), 0.3);
        }

        .reader-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 阅读器主体 */
        .reader-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            margin-top: 80px;
        }

        /* 章节侧边栏 */
        .reader-sidebar {
            position: fixed;
            right: 0;
            top: 80px;
            bottom: 0;
            width: 320px;
            background: var(--card-bg);
            border-left: 1px solid var(--card-border);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .reader-sidebar.active {
            transform: translateX(0);
        }

        .reader-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .reader-sidebar-header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .reader-sidebar-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .reader-sidebar-close:hover {
            background: rgba(var(--accent-color-rgb), 0.1);
            color: var(--text-main);
        }

        .reader-sidebar-close svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .reader-chapter-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .reader-chapter-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .reader-chapter-item:hover {
            background: rgba(var(--accent-color-rgb), 0.08);
        }

        .reader-chapter-item.active {
            background: rgba(var(--accent-color-rgb), 0.15);
        }

        .reader-chapter-item .chapter-number {
            font-size: 12px;
            color: var(--text-sub);
        }

        .reader-chapter-item .chapter-title {
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reader-chapter-item.active .chapter-title {
            color: rgb(var(--accent-color-rgb));
        }

        /* 阅读区域 */
        .reader-content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .reader-content {
            flex: 1;
            overflow-y: auto;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .reader-chapter-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
        }

        .reader-chapter-meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--card-border);
        }

        .reader-chapter-meta span {
            font-size: 13px;
            color: var(--text-sub);
        }

        .reader-chapter-text {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-main);
        }

        .reader-chapter-text p {
            margin-bottom: 1.5em;
            text-indent: 2em;
        }
        
        /* 隐藏水印占位符 */
        .watermark-placeholder {
            display: none !important;
            visibility: hidden;
            width: 0;
            height: 0;
            font-size: 0;
            line-height: 0;
        }

        /* 字体设置面板 */
        .reader-settings-panel {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 400px;
            max-width: 90vw;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 
                        0 0 0 1px rgba(var(--accent-color-rgb), 0.1);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2100;
            display: flex;
            flex-direction: column;
            max-height: 80vh;
            overflow: hidden;
        }

        .reader-settings-panel.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .reader-settings-panel.dragging {
            transition: none;
            cursor: grabbing;
        }

        .reader-settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--card-border);
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        .reader-settings-header:active {
            cursor: grabbing;
        }

        .reader-settings-header h4 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .reader-settings-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .reader-settings-close:hover {
            background: rgba(var(--accent-color-rgb), 0.1);
            color: var(--text-main);
        }

        .reader-settings-close svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .reader-settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .reader-setting-item {
            margin-bottom: 24px;
        }

        .reader-setting-item label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .reader-font-size-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .reader-font-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reader-font-btn:hover {
            background: rgba(var(--accent-color-rgb), 0.1);
            border-color: rgba(var(--accent-color-rgb), 0.3);
        }

        .reader-font-size-display {
            width: 70px;
            height: 40px;
            font-size: 14px;
            color: var(--text-main);
            background: transparent;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            text-align: center;
            padding: 0;
            transition: all 0.2s ease;
        }
        
        .reader-font-size-display:focus {
            outline: none;
            border-color: rgba(var(--accent-color-rgb), 0.5);
            background: rgba(var(--accent-color-rgb), 0.05);
        }
        
        .reader-font-size-display::-webkit-outer-spin-button,
        .reader-font-size-display::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .reader-font-size-display {
            appearance: none;
            -moz-appearance: textfield;
        }

        .reader-line-height-control {
            display: flex;
            gap: 8px;
        }

        .reader-line-btn {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-sub);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reader-line-btn:hover {
            border-color: rgba(var(--accent-color-rgb), 0.3);
        }

        .reader-line-btn.active {
            background: rgba(var(--accent-color-rgb), 0.15);
            border-color: rgb(var(--accent-color-rgb));
            color: rgb(var(--accent-color-rgb));
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .reader-header {
                padding: 16px 20px;
                height: 70px;
            }
            
            .reader-sidebar {
                width: 100%;
            }
            
            .reader-novel-title {
                font-size: 1rem;
                padding: 0 16px;
            }
            
            .reader-chapter-title {
                font-size: 1.5rem;
            }
            
            .reader-content {
                padding: 24px 16px !important;
            }
            
            .reader-nav {
                padding: 12px 16px;
            }
            
            .reader-nav-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- 小说阅读页面 -->
    <section id="reader-page" class="page">
        <div class="reader-container">
            <!-- 阅读器头部 -->
            <div class="reader-header">
                <button class="reader-back-btn" id="readerBackBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    返回
                </button>
                <h2 class="reader-novel-title" id="readerNovelTitle">小说标题</h2>
                <div class="reader-actions">
                    <button class="reader-btn" id="fontSizeBtn" title="字体大小">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 7V4h16v3M9 20h6M12 4v16"/>
                        </svg>
                    </button>
                    <button class="reader-btn" id="tocBtn" title="目录">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- 阅读器主体 -->
            <div class="reader-body">
                <!-- 章节侧边栏 -->
                <div class="reader-sidebar" id="readerSidebar">
                    <div class="reader-sidebar-header">
                        <h3>章节目录</h3>
                        <button class="reader-sidebar-close" id="sidebarCloseBtn">
                            <svg viewBox="0 0 24 24">
                                <path d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                    <div class="reader-chapter-list" id="chapterList">
                        <!-- 章节列表动态生成 -->
                    </div>
                </div>
                
                <!-- 阅读区域 -->
                <div class="reader-content-wrapper">
                    <div class="reader-content" id="readerContent">
                        <h1 class="reader-chapter-title" id="chapterTitle">章节标题</h1>
                        <div class="reader-chapter-text" id="chapterText">
                            <!-- 章节内容 -->
                        </div>
                    </div>
                    
                    <!-- 阅读进度条 -->
                    <div class="reader-progress-bar">
                        <div class="reader-progress-fill" id="readerProgressFill"></div>
                    </div>
                </div>
            </div>
            
            <!-- 字体设置面板 -->
            <div class="reader-settings-panel" id="fontSettingsPanel">
                <div class="reader-settings-header">
                    <h4>阅读设置</h4>
                    <button class="reader-settings-close" id="fontSettingsClose">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div class="reader-settings-content">
                    <div class="reader-setting-item">
                        <label>字体大小</label>
                        <div class="reader-font-size-control">
                            <button class="reader-font-btn" id="fontSizeDec">A-</button>
                            <input type="number" class="reader-font-size-display" id="fontSizeDisplay" value="18" min="12" max="36" step="1">
                            <button class="reader-font-btn" id="fontSizeInc">A+</button>
                        </div>
                    </div>
                    <div class="reader-setting-item">
                        <label>行间距</label>
                        <div class="reader-line-height-control">
                            <button class="reader-line-btn" data-height="1.6">紧凑</button>
                            <button class="reader-line-btn active" data-height="1.8">舒适</button>
                            <button class="reader-line-btn" data-height="2.0">宽松</button>
                        </div>
                    </div>
                    <div class="reader-setting-item">
                        <label>主题</label>
                        <div class="reader-line-height-control">
                            <button class="reader-theme-btn" data-theme="light" id="lightThemeBtn">
                                亮色
                            </button>
                            <button class="reader-theme-btn" data-theme="dark" id="darkThemeBtn">
                                暗色
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 加载小说数据 -->
    <script src="data/novels.js"></script>
    
    <script>
        // ==================== 
        // 小说数据
        // ==================== 
        
        // 全局变量存储所有小说数据
        let novelsData = [];
        let loadedNovels = new Set();
        
        // 动态加载章节数据（使用script标签方式，避免CORS问题）
        function loadNovelData(novelId) {
            console.log(`loadNovelData called for novel ${novelId}`);
            
            return new Promise((resolve, reject) => {
                // 如果已经加载过，直接返回
                if (loadedNovels.has(novelId)) {
                    const novel = novelsData.find(n => n.id === novelId);
                    if (novel && novel.content) {
                        console.log(`✓ 小说 ${novelId} 已经加载过，直接返回`);
                        resolve(novel);
                        return;
                    }
                }
                
                // 创建script标签动态加载
                const script = document.createElement('script');
                script.src = `data/novels/${novelId}.js`;
                script.onload = () => {
                    // 数据加载到window对象后，获取章节数据
                    const contentVarName = `novel_${novelId}_content`;
                    const content = window[contentVarName];
                    
                    if (content && Array.isArray(content)) {
                        const novel = novelsData.find(n => n.id === novelId);
                        if (novel) {
                            novel.content = content;
                            loadedNovels.add(novelId);
                            console.log(`✓ 小说 ${novelId} 章节数据加载成功，共 ${content.length} 章`);
                            resolve(novel);
                        } else {
                            console.error(`未找到小说 ID ${novelId} 在 novelsData 中`);
                            reject(new Error('Novel not found'));
                        }
                    } else {
                        console.error(`变量 ${contentVarName} 不存在或不是数组`);
                        reject(new Error('Invalid content format'));
                    }
                    
                    // 清理script标签
                    document.head.removeChild(script);
                };
                
                script.onerror = () => {
                    console.error(`加载小说 ${novelId} 的JS文件失败`);
                    reject(new Error('Failed to load script'));
                    document.head.removeChild(script);
                };
                
                document.head.appendChild(script);
            });
        }

        // 初始化novelsData - 确保在DOM加载后执行
        function initNovelsData() {
            console.log('initNovelsData called, novelsIndex type:', typeof novelsIndex);
            if (typeof novelsIndex !== 'undefined') {
                novelsData = novelsIndex;
                console.log('✓ novelsData initialized with', novelsData.length, 'novels');
            } else {
                console.error('✗ novelsIndex is undefined!');
                novelsData = [];
            }
        }

        // ==================== 
        // 阅读器模块 - 小说阅读功能
        // ==================== 

        // ==================== 
        // 全局变量定义
        // ==================== 

        // 当前阅读的小说ID
        let currentNovelId = null;

        // 当前章节索引
        let currentChapterIndex = 0;

        // 阅读器设置
        const readerSettings = {
            fontSize: 18,
            lineHeight: 1.8
        };

        // ==================== 
        // 零宽字符编码功能
        // ==================== 

        // ==================== 
        // 阅读器核心功能
        // ====================

        /**
         * 关闭阅读器
         */
        function closeReader() {
            // 关闭设置面板和侧边栏
            closeFontSettingsPanel();
            closeSidebar();
            
            currentNovelId = null;
            currentChapterIndex = 0;
            
            // 设置从阅读器返回的标记
            localStorage.setItem('fromReader', 'true');
            
            // 返回到首页
            window.location.href = 'index.html';
        }

        /**
         * 渲染章节列表
         * @param {Object} novel - 小说对象
         */
        function renderChapterList(novel) {
            const listEl = document.getElementById('chapterList');
            if (!listEl) return;
            
            listEl.innerHTML = '';
            
            if (!novel.content || !Array.isArray(novel.content)) {
                console.error('小说章节数据无效:', novel);
                return;
            }
            
            novel.content.forEach((chapter, index) => {
                const item = document.createElement('div');
                item.className = 'reader-chapter-item';
                item.dataset.index = index;
                
                const chapterTitle = chapter.chapterTitle || `第${index + 1}章`;
                const displayTitle = chapterTitle.replace(/第.*?章[：:]?\s*/, '');
                
                item.innerHTML = `
                    <span class="chapter-number">第${index + 1}章</span>
                    <span class="chapter-title">${displayTitle}</span>
                `;
                item.addEventListener('click', () => {
                    loadChapter(index);
                    closeSidebar();
                });
                listEl.appendChild(item);
            });
        }

        /**
         * 加载章节内容
         * @param {number} index - 章节索引
         */
        function loadChapter(index) {
            const novel = novelsData.find(n => n.id === currentNovelId);
            if (!novel || !novel.content || !novel.content[index]) {
                console.error('无法加载章节，novel:', novel, 'index:', index);
                return;
            }
            
            currentChapterIndex = index;
            const chapter = novel.content[index];
            
            // 检查章节数据
            if (!chapter.chapterTitle) {
                console.warn('章节缺少标题:', chapter);
            }
            
            // 更新章节标题
            const titleEl = document.getElementById('chapterTitle');
            if (titleEl) titleEl.textContent = chapter.chapterTitle || '无标题';
            
            // 更新章节内容
            const textEl = document.getElementById('chapterText');
            if (textEl) {
                if (chapter.content && typeof chapter.content === 'string') {
                    // 将内容按段落分割，每段包装在<p>标签中
                    const paragraphs = chapter.content.split('\n\n').filter(p => p.trim());
                    textEl.innerHTML = paragraphs.map(p => `<p>${p.trim()}</p>`).join('');
                } else {
                    console.warn('章节内容为空或格式不正确:', chapter);
                    textEl.innerHTML = '<p>该章节暂无内容</p>';
                }
            }
            
            // 更新章节列表高亮
            document.querySelectorAll('.reader-chapter-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            
            // 滚动到顶部
            const contentEl = document.getElementById('readerContent');
            if (contentEl) contentEl.scrollTop = 0;
            
            // 保存阅读进度
            saveReadingProgress(currentNovelId, index);
        }

        /**
         * 加载上一章
         */
        function loadPrevChapter() {
            console.log('loadPrevChapter called, currentChapterIndex:', currentChapterIndex);
            if (currentChapterIndex > 0) {
                loadChapter(currentChapterIndex - 1);
            } else {
                console.log('Already at first chapter');
            }
        }

        /**
         * 加载下一章
         */
        function loadNextChapter() {
            console.log('loadNextChapter called, currentNovelId:', currentNovelId, 'currentChapterIndex:', currentChapterIndex);
            const novel = novelsData.find(n => n.id === currentNovelId);
            if (novel && currentChapterIndex < novel.content.length - 1) {
                loadChapter(currentChapterIndex + 1);
            } else {
                console.log('Cannot load next chapter, novel:', novel, 'content length:', novel ? novel.content.length : 'N/A');
            }
        }

        // ==================== 
        // 阅读进度管理
        // ==================== 

        /**
         * 保存阅读进度
         * @param {number} novelId - 小说ID
         * @param {number} chapterIndex - 章节索引
         */
        function saveReadingProgress(novelId, chapterIndex) {
            const progress = JSON.parse(localStorage.getItem('novelReadingProgress') || '{}');
            progress[novelId] = chapterIndex;
            localStorage.setItem('novelReadingProgress', JSON.stringify(progress));
        }

        /**
         * 获取阅读进度
         * @param {number} novelId - 小说ID
         * @returns {number} 章节索引
         */
        function getReadingProgress(novelId) {
            const progress = JSON.parse(localStorage.getItem('novelReadingProgress') || '{}');
            return progress[novelId] || 0;
        }

        // ==================== 
        // 阅读器UI控制
        // ==================== 

        /**
         * 打开侧边栏
         */
        function openSidebar() {
            const sidebar = document.getElementById('readerSidebar');
            if (sidebar) sidebar.classList.add('active');
        }

        /**
         * 关闭侧边栏
         */
        function closeSidebar() {
            const sidebar = document.getElementById('readerSidebar');
            if (sidebar) sidebar.classList.remove('active');
        }

        /**
         * 打开字体设置面板
         */
        function openFontSettingsPanel() {
            const panel = document.getElementById('fontSettingsPanel');
            if (panel) panel.classList.add('active');
        }

        /**
         * 关闭字体设置面板
         */
        function closeFontSettingsPanel() {
            const panel = document.getElementById('fontSettingsPanel');
            if (panel) panel.classList.remove('active');
        }

        // ==================== 
        // 字体设置面板拖动功能
        // ==================== 

        /**
         * 初始化面板拖动功能
         */
        function initPanelDrag() {
            const panel = document.getElementById('fontSettingsPanel');
            const header = document.querySelector('.reader-settings-header');
            
            if (!panel || !header) return;
            
            let isDragging = false;
            let startX, startY;
            let panelX, panelY;
            let offsetX, offsetY;
            
            // 鼠标按下事件
            header.addEventListener('mousedown', (e) => {
                // 如果点击的是关闭按钮，不触发拖动
                if (e.target.closest('.reader-settings-close')) return;
                
                isDragging = true;
                panel.classList.add('dragging');
                
                // 获取面板当前位置
                const rect = panel.getBoundingClientRect();
                panelX = rect.left;
                panelY = rect.top;
                
                // 记录鼠标相对面板的偏移量
                offsetX = e.clientX - panelX;
                offsetY = e.clientY - panelY;
                
                // 记录初始位置
                startX = e.clientX;
                startY = e.clientY;
                
                e.preventDefault();
            });
            
            // 鼠标移动事件
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                // 计算新位置
                let newX = e.clientX - offsetX;
                let newY = e.clientY - offsetY;
                
                // 确保面板不会拖出屏幕
                const panelWidth = panel.offsetWidth;
                const panelHeight = panel.offsetHeight;
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                
                // 限制边界
                newX = Math.max(10, Math.min(newX, windowWidth - panelWidth - 10));
                newY = Math.max(10, Math.min(newY, windowHeight - panelHeight - 10));
                
                // 更新面板位置
                panel.style.left = newX + panelWidth / 2 + 'px';
                panel.style.top = newY + panelHeight / 2 + 'px';
                panel.style.transform = 'translate(-50%, -50%) scale(1)';
            });
            
            // 鼠标松开事件
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    panel.classList.remove('dragging');
                }
            });
            
            // 触摸事件支持（移动端）
            header.addEventListener('touchstart', (e) => {
                if (e.target.closest('.reader-settings-close')) return;
                
                isDragging = true;
                panel.classList.add('dragging');
                
                const rect = panel.getBoundingClientRect();
                panelX = rect.left;
                panelY = rect.top;
                
                const touch = e.touches[0];
                offsetX = touch.clientX - panelX;
                offsetY = touch.clientY - panelY;
                
                startX = touch.clientX;
                startY = touch.clientY;
                
                e.preventDefault();
            });
            
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                
                const touch = e.touches[0];
                let newX = touch.clientX - offsetX;
                let newY = touch.clientY - offsetY;
                
                const panelWidth = panel.offsetWidth;
                const panelHeight = panel.offsetHeight;
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                
                newX = Math.max(10, Math.min(newX, windowWidth - panelWidth - 10));
                newY = Math.max(10, Math.min(newY, windowHeight - panelHeight - 10));
                
                panel.style.left = newX + panelWidth / 2 + 'px';
                panel.style.top = newY + panelHeight / 2 + 'px';
                panel.style.transform = 'translate(-50%, -50%) scale(1)';
            });
            
            document.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    panel.classList.remove('dragging');
                }
            });
        }

        // ==================== 
        // 阅读器设置管理
        // ==================== 

        /**
         * 更新字体大小
         * @param {number} size - 字体大小
         */
        function updateFontSize(size) {
            readerSettings.fontSize = Math.max(12, Math.min(36, size));
            const textEl = document.getElementById('chapterText');
            if (textEl) textEl.style.fontSize = readerSettings.fontSize + 'px';
            
            const displayEl = document.getElementById('fontSizeDisplay');
            if (displayEl) displayEl.value = readerSettings.fontSize;
            
            localStorage.setItem('readerSettings', JSON.stringify(readerSettings));
        }

        /**
         * 更新行间距
         * @param {number} height - 行间距
         */
        function updateLineHeight(height) {
            readerSettings.lineHeight = height;
            const textEl = document.getElementById('chapterText');
            if (textEl) textEl.style.lineHeight = height;
            
            // 更新按钮状态
            document.querySelectorAll('.reader-line-btn').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.height) === height);
            });
            
            localStorage.setItem('readerSettings', JSON.stringify(readerSettings));
        }

        // ==================== 
        // 阅读器初始化
        // ==================== 

        /**
         * 重置面板位置（关闭时）
         */
        function resetPanelPosition() {
            const panel = document.getElementById('fontSettingsPanel');
            if (panel) {
                panel.style.left = '50%';
                panel.style.top = '50%';
                panel.style.transform = 'translate(-50%, -50%) scale(0.9)';
            }
        }

        /**
         * 初始化阅读器
         */
        function initReader() {
            try {
                // 加载保存的设置
                const savedSettings = localStorage.getItem('readerSettings');
                if (savedSettings) {
                    try {
                        const parsed = JSON.parse(savedSettings);
                        if (parsed) Object.assign(readerSettings, parsed);
                    } catch (e) {
                        console.warn('解析阅读器设置失败:', e);
                    }
                }
                
                // 应用设置
                const textEl = document.getElementById('chapterText');
                if (textEl) {
                    textEl.style.fontSize = readerSettings.fontSize + 'px';
                    textEl.style.lineHeight = readerSettings.lineHeight;
                }
                
                const displayEl = document.getElementById('fontSizeDisplay');
                if (displayEl) {
                    displayEl.value = readerSettings.fontSize;
                    displayEl.addEventListener('change', (e) => {
                        const newSize = parseInt(e.target.value) || 18;
                        updateFontSize(newSize);
                    });
                    displayEl.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            const newSize = parseInt(e.target.value) || 18;
                            updateFontSize(newSize);
                            e.target.blur();
                        }
                    });
                }
                
                // 绑定事件
                const backBtn = document.getElementById('readerBackBtn');
                const tocBtn = document.getElementById('tocBtn');
                const fontSizeBtn = document.getElementById('fontSizeBtn');
                const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
                const fontSizeDec = document.getElementById('fontSizeDec');
                const fontSizeInc = document.getElementById('fontSizeInc');
                const fontSettingsClose = document.getElementById('fontSettingsClose');
                
                if (backBtn) {
                    backBtn.addEventListener('click', closeReader);
                    console.log('Back button event bound');
                }
                if (tocBtn) {
                    tocBtn.addEventListener('click', openSidebar);
                    console.log('TOC button event bound');
                }
                if (fontSizeBtn) {
                    fontSizeBtn.addEventListener('click', openFontSettingsPanel);
                    console.log('Font size button event bound');
                }
                if (sidebarCloseBtn) {
                    sidebarCloseBtn.addEventListener('click', closeSidebar);
                    console.log('Sidebar close button event bound');
                }
                if (fontSizeDec) fontSizeDec.addEventListener('click', () => updateFontSize(readerSettings.fontSize - 1));
                if (fontSizeInc) fontSizeInc.addEventListener('click', () => updateFontSize(readerSettings.fontSize + 1));
                if (fontSettingsClose) {
                    fontSettingsClose.addEventListener('click', () => {
                        closeFontSettingsPanel();
                        resetPanelPosition();
                    });
                }
                
                // 初始化面板拖动功能
                initPanelDrag();
                
                // 行间距按钮
                document.querySelectorAll('.reader-line-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        updateLineHeight(parseFloat(btn.dataset.height));
                    });
                });
                
                // 键盘导航
                document.addEventListener('keydown', (e) => {
                    if (!currentNovelId) return;
                    if (e.key === 'ArrowLeft') loadPrevChapter();
                    if (e.key === 'ArrowRight') loadNextChapter();
                    if (e.key === 'Escape') closeReader();
                });
                
                // 更新行间距按钮状态
                document.querySelectorAll('.reader-line-btn').forEach(btn => {
                    btn.classList.toggle('active', parseFloat(btn.dataset.height) === readerSettings.lineHeight);
                });
                
                console.log('initReader completed successfully');
            } catch (error) {
                console.error('initReader 执行出错:', error);
            }
        }

        // ====================
        // 小说阅读页面初始化
        // ====================

        /**
         * 阅读器页面初始化
         */
        async function initWordPage() {
            console.log('Word page initialization started');
            
            try {
                // 检查数据加载
                if (typeof novelsData === 'undefined') {
                    console.error('novelsData 未定义，数据加载失败');
                    alert('小说数据加载失败，请返回首页重试');
                    return;
                }
                console.log('novelsData loaded:', novelsData.length, 'novels');
            
                // 主题切换功能
                updateThemeButtons();
                
                // 初始化阅读器
                if (typeof initReader === 'function') {
                    initReader();
                } else {
                    console.error('initReader 函数未定义');
                }
                
                // 从URL参数获取小说ID和章节索引
                const urlParams = new URLSearchParams(window.location.search);
                const novelId = parseInt(urlParams.get('id'));
                const chapterIndex = parseInt(urlParams.get('chapter')) || 0;
                console.log('URL params:', { novelId, chapterIndex });
                
                if (novelId) {
                    // 先从novelsData中查找基本信息
                    let novel = novelsData.find(n => n.id === novelId);
                    console.log('Found novel in index:', novel ? novel.title : 'not found');
                    
                    if (!novel) {
                        alert('未找到该小说');
                        window.location.href = 'index.html';
                        return;
                    }
                    
                    // 动态加载章节数据
                    console.log('Loading chapter content for novel ID:', novelId);
                    const loadedNovel = await loadNovelData(novelId);
                    
                    if (loadedNovel) {
                        // 使用包含章节内容的小说对象
                        novel = loadedNovel;
                        console.log('Chapter content loaded, total chapters:', novel.content ? novel.content.length : 0);
                    } else {
                        console.error('Failed to load chapter content');
                        alert('该小说暂无章节内容，请检查数据文件');
                        return;
                    }
                    
                    currentNovelId = novelId;
                    
                    // 更新标题
                    const titleEl = document.getElementById('readerNovelTitle');
                    if (titleEl) titleEl.textContent = novel.title;
                    
                    // 检查是否有章节内容
                    if (!novel.content || novel.content.length === 0) {
                        console.error('小说没有章节内容');
                        alert('该小说暂无章节内容');
                        return;
                    }
                    
                    // 渲染章节列表
                    if (typeof renderChapterList === 'function') {
                        renderChapterList(novel);
                    }
                    
                    // 加载章节
                    if (typeof loadChapter === 'function') {
                        loadChapter(chapterIndex);
                    } else {
                        console.error('loadChapter 函数未定义');
                    }
                } else {
                    alert('参数错误');
                    window.location.href = 'index.html';
                }
                
                // 绑定主题切换按钮事件
                bindThemeToggleEvents();
                
            } catch (error) {
                console.error('页面初始化出错:', error);
                alert('页面加载出错，请返回首页重试');
            }
        }

        /**
         * 更新主题按钮状态
         */
        function updateThemeButtons() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            const lightThemeBtn = document.getElementById('lightThemeBtn');
            const darkThemeBtn = document.getElementById('darkThemeBtn');
            
            if (lightThemeBtn && darkThemeBtn) {
                if (savedTheme === 'light') {
                    lightThemeBtn.classList.add('active');
                    darkThemeBtn.classList.remove('active');
                } else {
                    darkThemeBtn.classList.add('active');
                    lightThemeBtn.classList.remove('active');
                }
            }
        }

        /**
         * 绑定主题切换按钮事件
         */
        function bindThemeToggleEvents() {
            const lightThemeBtn = document.getElementById('lightThemeBtn');
            const darkThemeBtn = document.getElementById('darkThemeBtn');
            
            if (lightThemeBtn) {
                lightThemeBtn.addEventListener('click', () => {
                    const theme = 'light';
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('theme', theme);
                    updateThemeButtons();
                });
            }
            
            if (darkThemeBtn) {
                darkThemeBtn.addEventListener('click', () => {
                    const theme = 'dark';
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('theme', theme);
                    updateThemeButtons();
                });
            }
        }

        // 当DOM加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initNovelsData();
                initWordPage();
            });
        } else {
            initNovelsData();
            initWordPage();
        }

        // 导出函数供HTML使用
        if (typeof window !== 'undefined') {
            window.closeReader = closeReader;
        }
    </script>
</body>
