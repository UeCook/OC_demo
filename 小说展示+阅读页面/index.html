<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的小说 - 圣堂之魂</title>
    
    <style>
        /* CSS变量与主题系统 */
        :root {
            --bg-color: #F8F8F8;
            --text-main: #1F1F1F;
            --text-body: #3D3D3D;
            --text-sub: #646464;
            --accent-color: 79, 192, 93;
            --complementary-color: 232, 179, 162;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(var(--accent-color), 0.3);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --card-radius: 24px;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #F0F0F0;
            --text-body: #D4D4D4;
            --text-sub: #A0A0A0;
            --complementary-color: 192, 122, 122;
            --card-bg: rgba(30, 30, 30, 0.8);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            line-height: 1.6;
            overflow-y: auto;
        }

        /* 页面容器 */
        .page {
            min-height: 100vh;
            padding: 80px 24px 120px;
        }

        .novels-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .novels-container h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .novels-container > p {
            color: var(--text-sub);
            font-size: 1.1rem;
            max-width: 600px;
        }

        .novels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 28px;
            margin-top: 32px;
        }

        /* 卡片底层 */
        .novel-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--card-radius);
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            text-decoration: none;
            color: inherit;
            min-height: 280px;
            display: flex;
            flex-direction: column;
        }

        .novel-card:hover {
            border-color: rgba(var(--accent-color), 0.4);
        }

        /* 卡片层叠容器 */
        .novel-card-layers {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 280px;
        }

        /* 顶层-动画层 */
        .novel-card-animation {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: transparent;
            overflow: hidden;
            border-radius: var(--card-radius);
        }

        /* 聚光灯容器 */
        .spotlight-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: var(--card-radius);
        }

        /* 聚光灯效果 - 渐变光晕 */
        .spotlight {
            position: absolute;
            width: 1000px;
            height: 1000px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(
                circle at center,
                rgba(var(--accent-color), 0.15) 0%,
                rgba(var(--accent-color), 0.12) 20%,
                rgba(var(--accent-color), 0.08) 40%,
                rgba(var(--accent-color), 0.04) 60%,
                rgba(var(--accent-color), 0.01) 80%,
                transparent 100%
            );
            filter: blur(100px);
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        /* 卡片悬停时显示聚光灯 */
        .novel-card:hover .spotlight {
            opacity: 1;
        }

        /* 中层-文字层 */
        .novel-card-content {
            position: absolute;
            inset: 0;
            z-index: 2;
            padding: 28px;
            display: flex;
            flex-direction: column;
        }

        .novel-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .novel-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 12px;
            word-wrap: break-word;
        }

        .novel-summary {
            font-size: 0.95rem;
            color: var(--text-body);
            line-height: 1.7;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .novel-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }

        .novel-tag {
            padding: 5px 12px;
            background: rgba(var(--accent-color), 0.12);
            color: rgba(var(--accent-color), 1);
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* 空状态 */
        .novels-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-sub);
        }

        /* 主题切换按钮 */
        .theme-toggle-corner {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2000;
        }

        .theme-toggle {
            position: relative;
            z-index: 3000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: var(--text-main);
            cursor: pointer;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.3s ease;
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        [data-theme="dark"] #sunIcon { display: none; }
        [data-theme="dark"] #moonIcon { display: block; }
        [data-theme="light"] #sunIcon { display: block; }
        [data-theme="light"] #moonIcon { display: none; }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .page {
                padding: 100px 16px 140px;
            }
            
            .novels-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="novels-container">
            <h1>我的小说</h1>
            <p>这里是我创作的小说作品，点击卡片可以跳转到阅读页面</p>
            
            <div class="novels-grid" id="novelsGrid">
                <!-- 小说卡片将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 主题切换按钮 -->
    <div class="theme-toggle-corner">
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
            <svg id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <!-- 加载小说数据 -->
    <script src="data/novels.js"></script>
    
    <script>
        // 使用加载的小说数据
        const novelsData = novelsIndex || [];

        // 小说管理器
        const NovelsManager = {
            getById(id) {
                return novelsData.find(novel => novel.id === id);
            },
            
            getByStatus(status) {
                return novelsData.filter(novel => novel.status === status);
            },
            
            getByTag(tag) {
                return novelsData.filter(novel => novel.tags.includes(tag));
            },
            
            getSortedByDate() {
                return [...novelsData].sort((a, b) => b.date.localeCompare(a.date));
            },
            
            getAllTags() {
                const tagSet = new Set();
                novelsData.forEach(novel => novel.tags.forEach(tag => tagSet.add(tag)));
                return Array.from(tagSet);
            }
        };

        // 创建小说卡片
        function createNovelCard(novel) {
            const card = document.createElement('div');
            card.className = 'novel-card';
            card.dataset.id = novel.id;
            card.onclick = () => {
                window.location.href = `reader.html?id=${novel.id}`;
            };
            
            card.innerHTML = `
                <div class="novel-card-layers">
                    <div class="novel-card-animation">
                        <div class="spotlight-container">
                            <div class="spotlight"></div>
                        </div>
                    </div>
                    <div class="novel-card-content">
                        <div class="novel-info">
                            <h3 class="novel-title">${novel.title}</h3>
                            <p class="novel-summary">${novel.summary}</p>
                            <div class="novel-tags">
                                ${novel.tags.map(tag => `<span class="novel-tag">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // 初始化聚光灯效果
            initSpotlight(card);
            
            return card;
        }

        // 初始化聚光灯效果
        function initSpotlight(card) {
            const spotlight = card.querySelector('.spotlight');
            
            if (!spotlight) return;
            
            // 鼠标移动事件
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // 更新聚光灯位置
                spotlight.style.left = `${x}px`;
                spotlight.style.top = `${y}px`;
            });
            
            // 鼠标离开时重置
            card.addEventListener('mouseleave', () => {
                // 聚光灯会在CSS中通过opacity过渡自动隐藏
            });
        }

        // 渲染小说
        function renderNovels(novels, append = false) {
            const grid = document.getElementById('novelsGrid');
            if (!grid) return;
            
            if (!append) {
                grid.innerHTML = '';
            }
            
            if (novels.length === 0) {
                grid.innerHTML = `
                    <div class="novels-empty">
                        <p>暂无小说</p>
                    </div>
                `;
                return;
            }
            
            novels.forEach(novel => {
                grid.appendChild(createNovelCard(novel));
            });
        }

        // 初始化小说页面
        function initNovels(filter = null) {
            let novels;
            
            if (filter?.status) {
                novels = NovelsManager.getByStatus(filter.status);
            } else if (filter?.tag) {
                novels = NovelsManager.getByTag(filter.tag);
            } else {
                novels = NovelsManager.getSortedByDate();
            }
            
            renderNovels(novels);
        }

        // 主题切换
        function initThemeToggle() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            
            if (!themeToggle) return;
            
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                html.setAttribute('data-theme', savedTheme);
            }
            
            themeToggle.addEventListener('click', () => {
                const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        }

        // DOM加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 直接使用静态加载的数据，无需等待
            initNovels();
            initThemeToggle();
        });
    </script>
</body>
</html>
